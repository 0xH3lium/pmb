[project]
name = "mcmc-pmb"
version = "0.1.0"
description = "MCMC workflow for probabilistic material balance analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"numpy",
	"pandas",
	"scipy",
	"matplotlib",
	"seaborn",
	"ipykernel>=7.1.0",
	"pymc>=5.26.1",
	"numba",
	"numpyro==0.15.2",
	"tensorflow-probability==0.24.0",
	"jax==0.4.30",
	"jaxlib==0.4.30",
	"joypy>=0.2.6",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
